<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Your Sanctuary - OrnaVillas</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="booking-style.css">
</head>

<body>
    <div class="booking-container">
        <!-- Background Reveal Image -->
        <div class="booking-bg"></div>
        <div class="booking-overlay"></div>

        <header class="booking-header">
            <a href="index.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Back to Gallery</span>
            </a>
            <div class="logo">OrnaVillas</div>
        </header>

        <main class="booking-content">
            <div class="booking-reveal-text">
                <span class="subtitle">Experience Luxury</span>
                <h1>Reserve Your<br>Sanctuary</h1>
            </div>

            <div class="booking-card">
                <form class="booking-form">
                    <div class="form-section">
                        <label>Select Your Destination</label>
                        <div class="select-wrapper">
                            <select id="destination">
                                <option>Provence, France</option>
                                <option>Marrakech, Morocco</option>
                                <option>Tuscany, Italy</option>
                                <option>Santorini, Greece</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-section">
                            <label>Check In</label>
                            <input type="date" id="check-in">
                        </div>
                        <div class="form-section">
                            <label>Check Out</label>
                            <input type="date" id="check-out">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-section">
                            <label>Guests</label>
                            <div class="number-input">
                                <button type="button" class="minus">-</button>
                                <input type="number" value="2" min="1" max="10">
                                <button type="button" class="plus">+</button>
                            </div>
                        </div>
                        <div class="form-section">
                            <label>Villa Type</label>
                            <div class="select-wrapper">
                                <select id="villa-type">
                                    <option>Standard Villa</option>
                                    <option>Premium Suite</option>
                                    <option>Royal Penthouse</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="confirm-btn">
                        <span>Check Availability</span>
                        <div class="btn-shine"></div>
                    </button>
                </form>
            </div>
        </main>

        <footer class="booking-footer">
            <div class="footer-info">
                <span>Free cancellation up to 48h</span>
                <span>Best price guaranteed</span>
                <span>Secure payment</span>
            </div>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="booking-script.js"></script>
</body>

</html>
